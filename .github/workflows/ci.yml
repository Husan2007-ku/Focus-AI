name: CI

# Har bir push va pull request'da avtomatik ishga tushadi — kod GitHub'ga
# yetib borishidan oldin barcha testlar o'tganini tasdiqlaydi.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres va Redis — haqiqiy xizmatlar sifatida, docker-compose'dagi
    # bilan bir xil versiyalarda. Testlar shu haqiqiy bazalarga ulanadi
    # (mock emas), shuning uchun ular ishlab chiqarish muhitidagi xatti-
    # harakatni to'g'ri aks ettiradi.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: focusai
          POSTGRES_PASSWORD: focusai
          POSTGRES_DB: focusai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focusai -d focusai_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql+asyncpg://focusai:focusai@localhost:5432/focusai_db
      DATABASE_ECHO: "false"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET_KEY: ci-test-jwt-secret-key
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      FIREBASE_CREDENTIALS_PATH: ./secrets/firebase-service-account.json

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bog'liqliklarni o'rnatish
        run: |
          pip install --upgrade pip setuptools
          pip install ".[dev]"

      # MUHIM: o'rnatilgan paketlarda ma'lum xavfsizlik zaifliklari (CVE)
      # bor-yo'qligini tekshiradi (P3 audit topilmasi). Agar bu qadam
      # qizil bo'lsa -- bu kodning o'zidagi xato emas, biror bog'liqlikning
      # yangi versiyasida tuzatilgan zaiflik degani; `pip-audit` xabarida
      # qaysi paket va qaysi versiyaga yangilash kerakligi ko'rsatiladi.
      # Pastdagi ikki ID -- ataylab chetlab o'tiladi (triage qilingan, amalda
      # bu loyihada ishlamaydi), boshqa HAR QANDAY yangi topilma CI'ni qizil
      # qiladi:
      #   PYSEC-2026-1325 (ecdsa Minerva timing attack): `ecdsa` faqat
      #     python-jose'ning ishlatilmayotgan pure-python backend'i uchun
      #     tranzitiv bog'liqlik -- biz "python-jose[cryptography]" extra'sini
      #     ataylab o'rnatganmiz va kodda hech qayerda `ecdsa.SigningKey`
      #     chaqirilmaydi (faqat HS256/HMAC ishlatiladi, ECDSA imzolash
      #     umuman yo'q). Upstream'da "no planned fix" deb e'lon qilingan.
      #   CVE-2026-85394 (python-jose alg-confusion): hujum RS/ES turidagi
      #     asimmetrik kalit va public key talab qiladi; bu loyihada
      #     `jwt.decode(..., algorithms=[settings.JWT_ALGORITHM])` orqali
      #     FAQAT HS256 ruxsat etilgan va hech qachon public key
      #     ishlatilmaydi (qarang: app/core/security.py). Tuzatilgan versiya
      #     hali chiqmagan -- shu sabab vaqtincha chetlab o'tilmoqda, lekin
      #     bu qatorni olib tashlashni (fix chiqgach) unutmaslik kerak.
      - name: Xavfsizlik zaifliklari auditi (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln CVE-2026-85394

      - name: Lint tekshiruvi (ruff)
        run: ruff check app tests

      - name: Formatlash tekshiruvi (black)
        run: black --check app tests

      - name: Ma'lumotlar bazasi migratsiyalarini qo'llash
        run: alembic upgrade head

      - name: Testlarni ishga tushirish
        run: pytest -v --cov=app --cov-report=term-missing

      - name: Coverage hisobotini saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
