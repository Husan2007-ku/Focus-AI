[project]
name = "focusai-backend"
version = "0.1.0"
description = "FocusAI — AI-yordamchili fokus va produktivlik ilovasi uchun backend"
requires-python = ">=3.12"

dependencies = [
    # Framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Ma'lumotlar bazasi
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",

    # Sozlamalar va validatsiya
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",

    # Autentifikatsiya
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",

    # Redis va fon vazifalari
    "redis>=5.1.1",
    "celery>=5.4.0",

    # AI integratsiya
    "anthropic>=0.39.0",

    # Google OAuth token tekshiruvi
    "google-auth>=2.35.0",

    # Tashqi integratsiyalar
    "httpx>=0.27.2",
    "firebase-admin>=6.5.0",

    # Kuzatuv (observability)
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.16.0",

    # Yordamchi
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",

    # Rate limiting (IP-darajasida) — 2026-10-12 xavfsizlik auditi
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic/versions"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: loyihada FastAPI'ning standart `Depends()` konvensiyasi qasddan ishlatiladi
# (har so'rovda yangi DB sessiya/servis instance kerak — modul darajasidagi
# singleton bu yerda noto'g'ri bo'lardi). TZ.md 9-bandda qayd etilgan qaror.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
